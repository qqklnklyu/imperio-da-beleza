<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Acesso do proprietário"
    >

    <title>Nova senha | Império da Beleza</title>

    <link
        rel="stylesheet"
        href="/css/base.css"
    >

    <link
        rel="stylesheet"
        href="/admin/css/admin.css"
    >

    <meta
        name="robots"
        content="noindex"
    >
</head>

<body>

    <header>
        <div class="navbar">
            <a class="logo" href="/">✂ Império da Beleza</a>

            <div class="btns"><a class="btn ghost sm" href="/">← Site</a></div>
        </div>
    </header>

    <main class="page narrow">
        <div class="eyebrow">Área do dono</div>

        <h1>Nova senha</h1>

        <form class="panel" id="resetForm">
            <p>Escolha a nova senha do painel. Use de 8 a 128 caracteres.</p>

            <label>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>

            <label>Repita a nova senha<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>

            <button class="btn" type="submit">Salvar nova senha</button>

            <a class="link center" href="/admin/esqueci">Pedir um novo link</a>
        </form>
    </main>

    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <script src="/js/utils.js"></script>
    <script src="/admin/js/recover.js"></script>

</body>

</html>
