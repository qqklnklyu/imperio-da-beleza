<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Acesso do proprietário"
    >

    <title>Esqueci minha senha | Império da Beleza</title>

    <link
        rel="stylesheet"
        href="/css/base.css"
    >

    <link
        rel="stylesheet"
        href="/admin/css/admin.css"
    >

    <meta
        name="robots"
        content="noindex"
    >
</head>

<body>

    <header>
        <div class="navbar">
            <a class="logo" href="/">✂ Império da Beleza</a>

            <div class="btns"><a class="btn ghost sm" href="/">← Site</a></div>
        </div>
    </header>

    <main class="page narrow">
        <div class="eyebrow">Área do dono</div>

        <h1>Esqueci minha senha</h1>

        <form class="panel" id="forgotForm">
            <p>Informe o e-mail cadastrado do proprietário. Enviaremos um link para escolher uma nova senha.</p>

            <label>E-mail do proprietário<input id="email" type="email" autocomplete="email" placeholder="nome@exemplo.com" required></label>

            <button class="btn" type="submit">Enviar link</button>

            <a class="link center" href="/admin/login">Voltar para o login</a>
        </form>
    </main>

    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <script src="/js/utils.js"></script>
    <script src="/admin/js/recover.js"></script>

</body>

</html>
